<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPlanta | Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tienda.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-success" href="index.html"><img src="logo.png"
                        alt="Logo de la pagina" width="35 px"> AgroPlanta</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo y Cuidados</a></li>
                        <li class="nav-item"><a class="nav-link active" href="tienda.html">Tienda</a></li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrito.html">
                                🛒 Carrito <span id="cart-badge" class="badge bg-success">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 flex-grow-1">
        <div class="row">
            <aside class="col-md-3 mb-4" id="sidebar-filtros">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Filtros</h5>

                        <h6 class="mb-2">Categoría</h6>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="frutales"
                                id="cat-frutales">
                            <label class="form-check-label" for="cat-frutales">Árboles Frutales</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="cactaceas"
                                id="cat-cactaceas">
                            <label class="form-check-label" for="cat-cactaceas">Cactáceas</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="arbustos"
                                id="cat-arbustos">
                            <label class="form-check-label" for="cat-arbustos">Arbustos</label>
                        </div>

                        <hr>
                        <h6 class="mb-2">Precio máximo</h6>
                        <input type="range" class="form-range" min="0" max="1000" value="500" id="filtro-precio">
                        <div class="text-center text-muted">$<span id="valor-precio">500</span></div>
                    </div>
                </div>
            </aside>

            <section class="col-md-9" id="productos">
                <div class="row g-4" id="contenedor-productos">
                    <!-- Populated dynamically by js/tienda.js -->
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 AgroPlanta</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tienda.js"></script>
</body>

</html>
